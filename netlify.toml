[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deezer API proxy as a Netlify Edge Function
[[edge_functions]]
  path = "/deezer-proxy"
  function = "deezer-proxy"

# SPA fallback: serve index.html for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200